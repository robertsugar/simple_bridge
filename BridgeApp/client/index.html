<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <title>Egyszerű Bridzs</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <div class="entry" id="entry">
      <p>Írd be a neved a belépéshez (maximum 20 karakter)</p>
      <form id="entry-form">
        <input id="name" title="name" autocomplete="off" maxlength="20"><br/>
        <button id="enter">Belépek</button>
      </form>
    </div>
    <div class="board" id="mainblock">
      <div class="sidebar">
        <p id="player-list"></p>
        <div id="game-info">
          <div id="info-parti"></div>
          <div id="info-bemondas"></div>
          <div id="info-turn"></div>
          <div id="info-utesek"></div>
          <div id="info-licit"></div>
        </div>
        <div class="sidebar-bottom">
          <button id="leave-butt">Kilépés</button>
        </div>
      </div>
      <div class="game-place">
        <div class="seat seat-top">
          <div class="fan" id="fanR2"></div>
          <div class="plate" id="plateR2"></div>
        </div>
        <div class="middle-row">
          <div class="seat seat-side">
            <div class="fan" id="fanR1"></div>
            <div class="plate" id="plateR1"></div>
          </div>
          <div id="center-box">
            <button id="start-center">Játék indítása</button>
            <div id="bid-history"></div>
            <div id="trick-history"></div>
            <div class="trick-pos" id="trickR0"></div>
            <div class="trick-pos" id="trickR1"></div>
            <div class="trick-pos" id="trickR2"></div>
            <div class="trick-pos" id="trickR3"></div>
          </div>
          <div class="seat seat-side">
            <div class="fan" id="fanR3"></div>
            <div class="plate" id="plateR3"></div>
          </div>
        </div>
        <div id="bid-buttons">
          <div id="bid-actions">
            <button id="passz-butt">Passz</button>
            <button id="kontra-butt">Kontra</button>
            <button id="rekontra-butt">Rekontra</button>
          </div>
          <div id="bid-pick">
            <div id="bid-levels"></div>
            <div id="bid-denoms"></div>
          </div>
        </div>
        <div class="seat seat-bottom">
          <div class="fan own-fan" id="fanR0"></div>
          <div class="plate" id="plateR0"></div>
        </div>
        <div id="game-buttons">
          <button id="ujparti-butt">Új parti</button>
          <button id="claim-butt">Minden ütést viszek</button>
          <button id="undo-butt">Visszavonás</button>
          <button id="auto-butt">Auto befejezés</button>
        </div>
        <div id="leave-modal">
          <div id="leave-box">
            <div id="leave-title">Biztosan kilépsz a játékból?</div>
            <div id="leave-text">Felállsz a helyedről, és kikerülsz a játékosok közül.</div>
            <div id="leave-buttons">
              <button id="leave-yes">Igen, kilépek</button>
              <button id="leave-no">Mégse</button>
            </div>
          </div>
        </div>
        <div id="confirm-modal">
          <div id="confirm-box">
            <div id="confirm-title">Biztosan abbahagyjátok a mostani partit?</div>
            <div id="confirm-buttons">
              <button id="confirm-yes">Igen, új parti</button>
              <button id="confirm-no">Mégse</button>
            </div>
          </div>
        </div>
        <div id="left-modal">
          <div id="left-box">
            <div id="left-title"></div>
            <div id="left-text">Várjátok vissza, vagy kezdtek egy új partit?
              (A helyéről ki is dobhatjátok, és más ülhet oda.)</div>
            <div id="left-buttons">
              <button id="left-wait">Várunk rá</button>
              <button id="left-ujparti">Új parti</button>
            </div>
          </div>
        </div>
        <div id="claim-modal">
          <div id="claim-box">
            <div id="claim-title"></div>
            <div id="claim-text"></div>
            <div id="claim-buttons">
              <button id="claim-accept">Elfogadom</button>
              <button id="claim-reject">Nem fogadom el</button>
            </div>
          </div>
        </div>
        <div id="chat-area">
          <form id="chat-form">
            <input id="chat-input" autocomplete="off" maxlength="200" placeholder="Üzenet a játékosoknak...">
            <button id="chat-send">Küldés</button>
          </form>
          <div id="chat-log"></div>
        </div>
        <div id="result-modal">
          <div id="result-box">
            <div id="result-title">Vége a partinak!</div>
            <div id="result-lines"></div>
            <button id="result-ujparti">Új parti</button>
            <button id="result-close">Bezárás (lapok megtekintése)</button>
          </div>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="src/client.js"></script>
  </body>
</html>
