<!DOCTYPE html>
<html lang="hu">
  <head>
    <meta charset="utf-8">
    <title>Egyszeru Bridzs</title>
    <link rel="stylesheet" href="styles/main.css">
  </head>
  <body>
    <div class="entry" id="entry">
      <p>Ird be a neved a belepeshez (maximum 20 karakter)</p>
      <form id="entry-form">
        <input id="name" title="name" autocomplete="off" maxlength="20"><br/>
        <button id="enter">Belepek</button>
      </form>
    </div>
    <div class="board" id="mainblock">
      <div class="sidebar">
        <p id="player-list"></p>
        <div class="event-holder">
          <ul id="events"></ul>
        </div>
        <div class="button-wrapper">
          <form id="chat-form">
            <input id="chat" title="chat" autocomplete="off">
            <button id="say">Mondok</button>
          </form>
          <form id="start-game">
            <button id="start">Jatek inditasa</button>
          </form>
        </div>
      </div>
      <div class="game-place">
        <div id="state" class="state-bar"></div>
        <div class="seat seat-top">
          <div class="fan" id="fanR2"></div>
          <div class="plate" id="plateR2"></div>
        </div>
        <div class="middle-row">
          <div class="seat seat-side">
            <div class="fan" id="fanR1"></div>
            <div class="plate" id="plateR1"></div>
          </div>
          <div id="center-box">
            <div id="bid-history"></div>
            <div class="trick-pos" id="trickR0"></div>
            <div class="trick-pos" id="trickR1"></div>
            <div class="trick-pos" id="trickR2"></div>
            <div class="trick-pos" id="trickR3"></div>
          </div>
          <div class="seat seat-side">
            <div class="fan" id="fanR3"></div>
            <div class="plate" id="plateR3"></div>
          </div>
        </div>
        <div id="bid-buttons">
          <div id="bid-grid"></div>
          <div id="bid-actions">
            <button id="passz-butt">Passz</button>
            <button id="kontra-butt">Kontra</button>
            <button id="rekontra-butt">Rekontra</button>
          </div>
        </div>
        <div id="terito-area"></div>
        <div class="seat seat-bottom">
          <div class="fan own-fan" id="fanR0"></div>
          <div class="plate" id="plateR0"></div>
        </div>
        <div id="game-buttons">
          <button id="ujparti-butt">Uj parti</button>
          <button id="teritek-butt">Teritek</button>
          <button id="auto-butt">Auto befejezes</button>
        </div>
      </div>
    </div>
    <script src="/socket.io/socket.io.js"></script>
    <script src="src/client.js"></script>
  </body>
</html>
